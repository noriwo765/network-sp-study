<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script src="js/gate.js"></script>
  <title>ネットワーク・アニメーション</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ネスペ学習">
  <meta name="theme-color" content="#14171c">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/flow.css">
</head>
<body class="wide">
  <header>
    <p class="back"><a href="index.html">← メニューへ</a></p>
    <nav id="chapters" class="chapters" aria-label="本の章"></nav>
    <nav id="scenarios" class="scenarios" aria-label="この章のシナリオ"></nav>
    <h1 id="scn-title"></h1>
    <p class="syl" id="scn-syl"></p>
    <p class="sub"><span id="scn-sub"></span>　<span class="hint">（← → キー、または説明欄を左右にスワイプでもステップを移動できます）</span></p>
  </header>

  <nav id="timeline" class="timeline"></nav>

  <div class="card topo-card">
    <div class="topo-scroll" id="topo-scroll">
      <svg id="topo" viewBox="0 0 810 260" role="img"></svg>
    </div>
  </div>
  <div class="controls" id="controls">
      <button id="prev">◀ 前へ</button>
      <button id="play" class="primary">▶ 自動再生</button>
      <button id="next">次へ ▶</button>
      <button id="replay">↻ もう一度</button>
      <label>速度
        <select id="speed">
          <option value="0.5">0.5x</option>
          <option value="1" selected>1x</option>
          <option value="2">2x</option>
        </select>
      </label>
      <label class="predict"><input type="checkbox" id="predict"> 予想モード</label>
  </div>

  <div class="grid">
    <div class="card">
      <div class="step-head">
        <h3 id="step-title"></h3>
        <span id="step-count" class="muted"></span>
      </div>
      <div id="desc"></div>
      <div id="side"></div>
    </div>
    <div class="card">
      <div class="step-head">
        <h3>フレームの中身</h3>
        <button id="reveal-all" class="small">すべて表示</button>
      </div>
      <div id="frame"></div>
    </div>
  </div>

  <script src="js/book.js"></script>
  <script src="js/flow-engine.js"></script>
  <script src="js/scenarios/vlan.js"></script>
  <script src="js/scenarios/stp.js"></script>
  <script src="js/scenarios/basic.js"></script>
  <script src="js/scenarios/arp-spoof.js"></script>
  <script src="js/scenarios/dhcp.js"></script>
  <script src="js/scenarios/dns.js"></script>
  <script src="js/scenarios/tcp.js"></script>
  <script src="js/scenarios/handshake.js"></script>
  <script src="js/scenarios/header-rewrite.js"></script>
  <script src="js/scenarios/fragment.js"></script>
  <script src="js/scenarios/dos.js"></script>
  <script src="js/scenarios/mail.js"></script>
  <script src="js/scenarios/stateful-fw.js"></script>
  <script src="js/scenarios/napt.js"></script>
  <script src="js/scenarios/dot1x.js"></script>
  <script src="js/scenarios/sip.js"></script>
  <script src="js/scenarios/ospf.js"></script>
  <script src="js/scenarios/bgp.js"></script>
  <script src="js/scenarios/traceroute.js"></script>
  <script src="js/scenarios/vrrp.js"></script>
  <script src="js/scenarios/wan.js"></script>
  <script src="js/scenarios/lb.js"></script>
  <script src="js/scenarios/ipsec.js"></script>
  <script src="js/scenarios/gre.js"></script>
  <script src="js/scenarios/openflow.js"></script>
  <script src="js/scenarios/vxlan.js"></script>
  <script src="js/scenarios/tls.js"></script>
  <script src="js/scenarios/proxy.js"></script>
  <script src="js/scenarios/snmp.js"></script>
  <script>FlowApp.start();</script>
  <script src="js/pwa.js"></script>
</body>
</html>
