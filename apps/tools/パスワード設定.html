<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>合言葉の設定 — ネスペ学習</title>
  <style>
    :root { --bg:#14171c; --card:#1f242c; --text:#e6e9ee; --sub:#9aa4b2; --line:#3a4150; --accent:#5b8def; }
    * { box-sizing: border-box; }
    body { margin:0; padding:24px 16px; background:var(--bg); color:var(--text);
      font-family: system-ui,-apple-system,sans-serif; line-height:1.6; }
    main { max-width:560px; margin:0 auto; }
    h1 { font-size:20px; margin:0 0 4px; }
    p.sub { color:var(--sub); font-size:13px; margin:0 0 20px; }
    label { display:block; font-size:13px; color:var(--sub); margin:16px 0 6px; }
    input { width:100%; padding:12px 14px; font-size:16px; border:1px solid var(--line);
      border-radius:10px; background:var(--card); color:var(--text); outline:none; }
    .out { margin-top:20px; padding:14px; background:var(--card); border:1px solid var(--line);
      border-radius:10px; font-size:13px; }
    code { display:block; margin-top:8px; padding:12px; background:#0d1014; border-radius:8px;
      font-family: ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px; word-break:break-all; color:#9ecbff; }
    button { margin-top:10px; padding:8px 14px; font-size:14px; border:0; border-radius:8px;
      background:var(--accent); color:#fff; cursor:pointer; }
    .note { font-size:12px; color:var(--sub); margin-top:18px; border-top:1px solid var(--line); padding-top:14px; }
    .empty { color:var(--sub); }
  </style>
</head>
<body>
<main>
  <h1>🔑 合言葉の設定</h1>
  <p class="sub">合言葉を入力すると、<code style="display:inline;padding:2px 6px">apps/js/gate.js</code> に貼る1行が出ます。合言葉そのものは保存・送信されません（この画面の中だけで計算します）。</p>

  <label for="pw">合言葉</label>
  <input id="pw" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="例： nespe-gokaku-2026">

  <div class="out">
    <div><strong>gate.js に貼る行：</strong></div>
    <code id="line" class="empty">合言葉を入力すると、ここに出ます</code>
    <button id="copy" type="button" hidden>この行をコピー</button>
  </div>

  <p class="note">
    手順：上の行をコピー → <code style="display:inline;padding:2px 6px">apps/js/gate.js</code> の
    <code style="display:inline;padding:2px 6px">const HASH = ...;</code> の行とまるごと差し替え → 保存して push。<br>
    ※ 合言葉を変えたいときは、ここで新しい合言葉を入れ直して、同じように貼り替えます。
  </p>
</main>

<script>
const pw = document.getElementById('pw');
const line = document.getElementById('line');
const copy = document.getElementById('copy');

async function sha256hex(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

let current = '';
pw.addEventListener('input', async () => {
  const v = pw.value;
  if (!v) {
    line.textContent = '合言葉を入力すると、ここに出ます';
    line.classList.add('empty');
    copy.hidden = true;
    return;
  }
  const hash = await sha256hex(v);
  current = `  const HASH = '${hash}';`;
  line.textContent = current;
  line.classList.remove('empty');
  copy.hidden = false;
});

copy.addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(current);
    copy.textContent = 'コピーしました';
    setTimeout(() => (copy.textContent = 'この行をコピー'), 1500);
  } catch (e) {
    copy.textContent = '手動で選択してコピーしてください';
  }
});
</script>
</body>
</html>
